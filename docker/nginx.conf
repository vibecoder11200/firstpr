# Resolve `api` at request time (not startup) so nginx tolerates the compose
# startup race where web can begin before api's container is on the network.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    set $api_upstream http://api:4000;

    # SPA: serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API reverse-proxy to the api service inside the compose network
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Better Auth uses streaming/SSE for some handlers; disable proxy buffering
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /og/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}